schema_version: 1

context:
  name: taskflow
  version: "4.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/taskflow/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 2107f90e315e48a676922010b036357ff2b0c6b9160ce17fa9396e5860b1d715

build:
  number: 0
  skip:
    - win and vc < 14
  script:
    - if: unix
      then: bash "${RECIPE_DIR}/build.sh"
    - if: win
      then: call "%RECIPE_DIR%\\build.bat"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - make
    - if: not win
      then: ninja

# Windows CI runs upstream tests during the build; skip the installed-consumer
# package test there because rattler-build cannot remove its Azure test prefix.
tests:
  - if: unix
    then:
      requirements:
        run:
          - ${{ compiler('cxx') }}
          - ${{ stdlib("c") }}
          - cmake
          - ninja
      files:
        recipe:
          - tests/
      script:
        - test -d "${PREFIX}/include/taskflow"
        - test -f "${PREFIX}/include/taskflow/taskflow.hpp"
        - test -f "${PREFIX}/share/cmake/Taskflow/TaskflowConfig.cmake"
        - test -f "${PREFIX}/share/cmake/Taskflow/TaskflowConfigVersion.cmake"
        - cmake -S tests -B tests/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${PREFIX}"
        - cmake --build tests/build --config Release
        - ctest --test-dir tests/build --output-on-failure

about:
  homepage: https://github.com/taskflow/taskflow
  repository: https://github.com/taskflow/taskflow
  documentation: https://taskflow.github.io/taskflow/index.html
  summary: Parallel and Heterogeneous Task Programming in Modern C++
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeongseok-meta
    - davidbrochart
